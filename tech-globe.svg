<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <style>
      /* Outer orbit: r=195, 10 icons, 36deg apart, 18s */
      .a1{animation:oa1 18s linear infinite;transform-origin:250px 250px;}
      .a2{animation:oa2 18s linear infinite;transform-origin:250px 250px;}
      .a3{animation:oa3 18s linear infinite;transform-origin:250px 250px;}
      .a4{animation:oa4 18s linear infinite;transform-origin:250px 250px;}
      .a5{animation:oa5 18s linear infinite;transform-origin:250px 250px;}
      .a6{animation:oa6 18s linear infinite;transform-origin:250px 250px;}
      .a7{animation:oa7 18s linear infinite;transform-origin:250px 250px;}
      .a8{animation:oa8 18s linear infinite;transform-origin:250px 250px;}
      .a9{animation:oa9 18s linear infinite;transform-origin:250px 250px;}
      .a10{animation:oa10 18s linear infinite;transform-origin:250px 250px;}

      /* Middle orbit: r=122, 7 icons, ~51deg apart, 12s */
      .b1{animation:ob1 12s linear infinite;transform-origin:250px 250px;}
      .b2{animation:ob2 12s linear infinite;transform-origin:250px 250px;}
      .b3{animation:ob3 12s linear infinite;transform-origin:250px 250px;}
      .b4{animation:ob4 12s linear infinite;transform-origin:250px 250px;}
      .b5{animation:ob5 12s linear infinite;transform-origin:250px 250px;}
      .b6{animation:ob6 12s linear infinite;transform-origin:250px 250px;}
      .b7{animation:ob7 12s linear infinite;transform-origin:250px 250px;}

      /* Inner orbit: r=58, 3 icons, 120deg apart, 7s */
      .c1{animation:oc1 7s linear infinite;transform-origin:250px 250px;}
      .c2{animation:oc2 7s linear infinite;transform-origin:250px 250px;}
      .c3{animation:oc3 7s linear infinite;transform-origin:250px 250px;}

      /* OUTER — r=195, 10 icons at 0,36,72,108,144,180,216,252,288,324 deg */
      /* translate=(195*cos,195*sin); scale 0.55(top/far) to 1.0(bottom/near) */
      @keyframes oa1{
        0%  {transform:translate(195px,  0px)  scale(0.78);}  /* 0   sin=0    */
        10% {transform:translate(158px,114px)  scale(0.93);}  /* 36  sin=0.59 */
        20% {transform:translate(60px, 185px)  scale(1.00);}  /* 72  sin=0.95 */
        30% {transform:translate(-60px,185px)  scale(1.00);}  /* 108 sin=0.95 */
        40% {transform:translate(-158px,114px) scale(0.93);}  /* 144 sin=0.59 */
        50% {transform:translate(-195px, 0px)  scale(0.78);}  /* 180 sin=0    */
        60% {transform:translate(-158px,-114px)scale(0.63);}  /* 216 sin=-0.59*/
        70% {transform:translate(-60px,-185px) scale(0.55);}  /* 252 sin=-0.95*/
        80% {transform:translate(60px, -185px) scale(0.55);}  /* 288 sin=-0.95*/
        90% {transform:translate(158px,-114px) scale(0.63);}  /* 324 sin=-0.59*/
        100%{transform:translate(195px,  0px)  scale(0.78);}
      }
      @keyframes oa2{
        0%  {transform:translate(158px,114px)  scale(0.93);}
        10% {transform:translate(60px, 185px)  scale(1.00);}
        20% {transform:translate(-60px,185px)  scale(1.00);}
        30% {transform:translate(-158px,114px) scale(0.93);}
        40% {transform:translate(-195px, 0px)  scale(0.78);}
        50% {transform:translate(-158px,-114px)scale(0.63);}
        60% {transform:translate(-60px,-185px) scale(0.55);}
        70% {transform:translate(60px, -185px) scale(0.55);}
        80% {transform:translate(158px,-114px) scale(0.63);}
        90% {transform:translate(195px,  0px)  scale(0.78);}
        100%{transform:translate(158px,114px)  scale(0.93);}
      }
      @keyframes oa3{
        0%  {transform:translate(60px, 185px)  scale(1.00);}
        10% {transform:translate(-60px,185px)  scale(1.00);}
        20% {transform:translate(-158px,114px) scale(0.93);}
        30% {transform:translate(-195px, 0px)  scale(0.78);}
        40% {transform:translate(-158px,-114px)scale(0.63);}
        50% {transform:translate(-60px,-185px) scale(0.55);}
        60% {transform:translate(60px, -185px) scale(0.55);}
        70% {transform:translate(158px,-114px) scale(0.63);}
        80% {transform:translate(195px,  0px)  scale(0.78);}
        90% {transform:translate(158px,114px)  scale(0.93);}
        100%{transform:translate(60px, 185px)  scale(1.00);}
      }
      @keyframes oa4{
        0%  {transform:translate(-60px,185px)  scale(1.00);}
        10% {transform:translate(-158px,114px) scale(0.93);}
        20% {transform:translate(-195px, 0px)  scale(0.78);}
        30% {transform:translate(-158px,-114px)scale(0.63);}
        40% {transform:translate(-60px,-185px) scale(0.55);}
        50% {transform:translate(60px, -185px) scale(0.55);}
        60% {transform:translate(158px,-114px) scale(0.63);}
        70% {transform:translate(195px,  0px)  scale(0.78);}
        80% {transform:translate(158px,114px)  scale(0.93);}
        90% {transform:translate(60px, 185px)  scale(1.00);}
        100%{transform:translate(-60px,185px)  scale(1.00);}
      }
      @keyframes oa5{
        0%  {transform:translate(-158px,114px) scale(0.93);}
        10% {transform:translate(-195px, 0px)  scale(0.78);}
        20% {transform:translate(-158px,-114px)scale(0.63);}
        30% {transform:translate(-60px,-185px) scale(0.55);}
        40% {transform:translate(60px, -185px) scale(0.55);}
        50% {transform:translate(158px,-114px) scale(0.63);}
        60% {transform:translate(195px,  0px)  scale(0.78);}
        70% {transform:translate(158px,114px)  scale(0.93);}
        80% {transform:translate(60px, 185px)  scale(1.00);}
        90% {transform:translate(-60px,185px)  scale(1.00);}
        100%{transform:translate(-158px,114px) scale(0.93);}
      }
      @keyframes oa6{
        0%  {transform:translate(-195px, 0px)  scale(0.78);}
        10% {transform:translate(-158px,-114px)scale(0.63);}
        20% {transform:translate(-60px,-185px) scale(0.55);}
        30% {transform:translate(60px, -185px) scale(0.55);}
        40% {transform:translate(158px,-114px) scale(0.63);}
        50% {transform:translate(195px,  0px)  scale(0.78);}
        60% {transform:translate(158px,114px)  scale(0.93);}
        70% {transform:translate(60px, 185px)  scale(1.00);}
        80% {transform:translate(-60px,185px)  scale(1.00);}
        90% {transform:translate(-158px,114px) scale(0.93);}
        100%{transform:translate(-195px, 0px)  scale(0.78);}
      }
      @keyframes oa7{
        0%  {transform:translate(-158px,-114px)scale(0.63);}
        10% {transform:translate(-60px,-185px) scale(0.55);}
        20% {transform:translate(60px, -185px) scale(0.55);}
        30% {transform:translate(158px,-114px) scale(0.63);}
        40% {transform:translate(195px,  0px)  scale(0.78);}
        50% {transform:translate(158px,114px)  scale(0.93);}
        60% {transform:translate(60px, 185px)  scale(1.00);}
        70% {transform:translate(-60px,185px)  scale(1.00);}
        80% {transform:translate(-158px,114px) scale(0.93);}
        90% {transform:translate(-195px, 0px)  scale(0.78);}
        100%{transform:translate(-158px,-114px)scale(0.63);}
      }
      @keyframes oa8{
        0%  {transform:translate(-60px,-185px) scale(0.55);}
        10% {transform:translate(60px, -185px) scale(0.55);}
        20% {transform:translate(158px,-114px) scale(0.63);}
        30% {transform:translate(195px,  0px)  scale(0.78);}
        40% {transform:translate(158px,114px)  scale(0.93);}
        50% {transform:translate(60px, 185px)  scale(1.00);}
        60% {transform:translate(-60px,185px)  scale(1.00);}
        70% {transform:translate(-158px,114px) scale(0.93);}
        80% {transform:translate(-195px, 0px)  scale(0.78);}
        90% {transform:translate(-158px,-114px)scale(0.63);}
        100%{transform:translate(-60px,-185px) scale(0.55);}
      }
      @keyframes oa9{
        0%  {transform:translate(60px, -185px) scale(0.55);}
        10% {transform:translate(158px,-114px) scale(0.63);}
        20% {transform:translate(195px,  0px)  scale(0.78);}
        30% {transform:translate(158px,114px)  scale(0.93);}
        40% {transform:translate(60px, 185px)  scale(1.00);}
        50% {transform:translate(-60px,185px)  scale(1.00);}
        60% {transform:translate(-158px,114px) scale(0.93);}
        70% {transform:translate(-195px, 0px)  scale(0.78);}
        80% {transform:translate(-158px,-114px)scale(0.63);}
        90% {transform:translate(-60px,-185px) scale(0.55);}
        100%{transform:translate(60px, -185px) scale(0.55);}
      }
      @keyframes oa10{
        0%  {transform:translate(158px,-114px) scale(0.63);}
        10% {transform:translate(195px,  0px)  scale(0.78);}
        20% {transform:translate(158px,114px)  scale(0.93);}
        30% {transform:translate(60px, 185px)  scale(1.00);}
        40% {transform:translate(-60px,185px)  scale(1.00);}
        50% {transform:translate(-158px,114px) scale(0.93);}
        60% {transform:translate(-195px, 0px)  scale(0.78);}
        70% {transform:translate(-158px,-114px)scale(0.63);}
        80% {transform:translate(-60px,-185px) scale(0.55);}
        90% {transform:translate(60px, -185px) scale(0.55);}
        100%{transform:translate(158px,-114px) scale(0.63);}
      }

      /* MIDDLE — r=122, 7 icons at 0,51,103,154,206,257,309 deg */
      @keyframes ob1{
        0%  {transform:translate(122px,  0px)  scale(0.78);}
        14% {transform:translate(77px,  96px)  scale(0.97);}
        28% {transform:translate(-28px,118px)  scale(1.00);}
        43% {transform:translate(-112px,54px)  scale(0.88);}
        57% {transform:translate(-112px,-54px) scale(0.68);}
        71% {transform:translate(-28px,-118px) scale(0.56);}
        85% {transform:translate(77px, -96px)  scale(0.62);}
        100%{transform:translate(122px,  0px)  scale(0.78);}
      }
      @keyframes ob2{
        0%  {transform:translate(77px,  96px)  scale(0.97);}
        14% {transform:translate(-28px,118px)  scale(1.00);}
        28% {transform:translate(-112px,54px)  scale(0.88);}
        43% {transform:translate(-112px,-54px) scale(0.68);}
        57% {transform:translate(-28px,-118px) scale(0.56);}
        71% {transform:translate(77px, -96px)  scale(0.62);}
        85% {transform:translate(122px,  0px)  scale(0.78);}
        100%{transform:translate(77px,  96px)  scale(0.97);}
      }
      @keyframes ob3{
        0%  {transform:translate(-28px,118px)  scale(1.00);}
        14% {transform:translate(-112px,54px)  scale(0.88);}
        28% {transform:translate(-112px,-54px) scale(0.68);}
        43% {transform:translate(-28px,-118px) scale(0.56);}
        57% {transform:translate(77px, -96px)  scale(0.62);}
        71% {transform:translate(122px,  0px)  scale(0.78);}
        85% {transform:translate(77px,  96px)  scale(0.97);}
        100%{transform:translate(-28px,118px)  scale(1.00);}
      }
      @keyframes ob4{
        0%  {transform:translate(-112px,54px)  scale(0.88);}
        14% {transform:translate(-112px,-54px) scale(0.68);}
        28% {transform:translate(-28px,-118px) scale(0.56);}
        43% {transform:translate(77px, -96px)  scale(0.62);}
        57% {transform:translate(122px,  0px)  scale(0.78);}
        71% {transform:translate(77px,  96px)  scale(0.97);}
        85% {transform:translate(-28px,118px)  scale(1.00);}
        100%{transform:translate(-112px,54px)  scale(0.88);}
      }
      @keyframes ob5{
        0%  {transform:translate(-112px,-54px) scale(0.68);}
        14% {transform:translate(-28px,-118px) scale(0.56);}
        28% {transform:translate(77px, -96px)  scale(0.62);}
        43% {transform:translate(122px,  0px)  scale(0.78);}
        57% {transform:translate(77px,  96px)  scale(0.97);}
        71% {transform:translate(-28px,118px)  scale(1.00);}
        85% {transform:translate(-112px,54px)  scale(0.88);}
        100%{transform:translate(-112px,-54px) scale(0.68);}
      }
      @keyframes ob6{
        0%  {transform:translate(-28px,-118px) scale(0.56);}
        14% {transform:translate(77px, -96px)  scale(0.62);}
        28% {transform:translate(122px,  0px)  scale(0.78);}
        43% {transform:translate(77px,  96px)  scale(0.97);}
        57% {transform:translate(-28px,118px)  scale(1.00);}
        71% {transform:translate(-112px,54px)  scale(0.88);}
        85% {transform:translate(-112px,-54px) scale(0.68);}
        100%{transform:translate(-28px,-118px) scale(0.56);}
      }
      @keyframes ob7{
        0%  {transform:translate(77px, -96px)  scale(0.62);}
        14% {transform:translate(122px,  0px)  scale(0.78);}
        28% {transform:translate(77px,  96px)  scale(0.97);}
        43% {transform:translate(-28px,118px)  scale(1.00);}
        57% {transform:translate(-112px,54px)  scale(0.88);}
        71% {transform:translate(-112px,-54px) scale(0.68);}
        85% {transform:translate(-28px,-118px) scale(0.56);}
        100%{transform:translate(77px, -96px)  scale(0.62);}
      }

      /* INNER — r=58, 3 icons at 0,120,240 deg */
      @keyframes oc1{
        0%  {transform:translate(58px,  0px)   scale(0.78);}
        25% {transform:translate(0px,  58px)   scale(1.00);}
        50% {transform:translate(-58px, 0px)   scale(0.78);}
        75% {transform:translate(0px, -58px)   scale(0.55);}
        100%{transform:translate(58px,  0px)   scale(0.78);}
      }
      @keyframes oc2{
        0%  {transform:translate(-29px, 50px)  scale(0.92);}
        25% {transform:translate(-58px,-10px)  scale(0.70);}
        50% {transform:translate(29px, -50px)  scale(0.60);}
        75% {transform:translate(58px,  10px)  scale(0.85);}
        100%{transform:translate(-29px, 50px)  scale(0.92);}
      }
      @keyframes oc3{
        0%  {transform:translate(-29px,-50px)  scale(0.62);}
        25% {transform:translate(58px, -10px)  scale(0.78);}
        50% {transform:translate(29px,  50px)  scale(0.95);}
        75% {transform:translate(-58px, 10px)  scale(0.78);}
        100%{transform:translate(-29px,-50px)  scale(0.62);}
      }
    </style>
  </defs>

  <!-- Orbit circle guides -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="5 5" opacity="0.20"/>
  <circle cx="250" cy="250" r="122" fill="none" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="4 6" opacity="0.15"/>
  <circle cx="250" cy="250" r="58"  fill="none" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.12"/>

  <!-- Centre glow -->
  <circle cx="250" cy="250" r="18" fill="#61DAFB" opacity="0.10"/>
  <circle cx="250" cy="250" r="9"  fill="#61DAFB" opacity="0.18"/>

  <!-- ===== OUTER ORBIT — 10 icons, 44px, offset x=-22 y=-22 from centre ===== -->
  <g class="a1"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg"          x="228" y="228" width="44" height="44"/></g>
  <g class="a2"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" x="228" y="228" width="44" height="44"/></g>
  <g class="a3"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg"         x="228" y="228" width="44" height="44"/></g>
  <g class="a4"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"           x="228" y="228" width="44" height="44"/></g>
  <g class="a5"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"             x="228" y="228" width="44" height="44"/></g>
  <g class="a6"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg"           x="228" y="228" width="44" height="44"/></g>
  <g class="a7"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg"           x="228" y="228" width="44" height="44"/></g>
  <g class="a8"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/photoshop/photoshop-original.svg"   x="228" y="228" width="44" height="44"/></g>
  <g class="a9"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/windows8/windows8-original.svg"     x="228" y="228" width="44" height="44"/></g>
  <g class="a10"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg"        x="228" y="228" width="44" height="44"/></g>

  <!-- ===== MIDDLE ORBIT — 7 icons, 38px, offset x=-19 y=-19 ===== -->
  <g class="b1"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vscode/vscode-original.svg"               x="231" y="231" width="38" height="38"/></g>
  <g class="b2"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/illustrator/illustrator-plain.svg"         x="231" y="231" width="38" height="38"/></g>
  <g class="b3"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg"                     x="231" y="231" width="38" height="38"/></g>
  <g class="b4"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/jira/jira-original.svg"                   x="231" y="231" width="38" height="38"/></g>
  <g class="b5"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/canva/canva-original.svg"                 x="231" y="231" width="38" height="38"/></g>
  <g class="b6"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/npm/npm-original-wordmark.svg"            x="231" y="231" width="38" height="38"/></g>
  <g class="b7"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg"       x="231" y="231" width="38" height="38"/></g>

  <!-- ===== INNER ORBIT — 3 icons, 30px, offset x=-15 y=-15 ===== -->
  <!-- Miro badge -->
  <g class="c1">
    <rect x="235" y="235" width="30" height="30" rx="6" fill="#FFD02F"/>
    <text x="250" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#050038">miro</text>
  </g>
  <!-- CLO3D badge -->
  <g class="c2">
    <rect x="235" y="235" width="30" height="30" rx="6" fill="#1A1A2E"/>
    <text x="250" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" font-weight="700" fill="#E94560">CLO</text>
