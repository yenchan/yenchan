<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <style>
      /* Kiran-style: no orbit rings, icons scattered at varied sizes/positions
         across a circular area, gentle floating animation on each */
      .icon { animation: float 6s ease-in-out infinite; }
      .i1  { animation: float  6.0s ease-in-out infinite; }
      .i2  { animation: float  6.8s ease-in-out infinite; animation-delay:-1.2s; }
      .i3  { animation: float  5.5s ease-in-out infinite; animation-delay:-0.5s; }
      .i4  { animation: float  7.2s ease-in-out infinite; animation-delay:-2.1s; }
      .i5  { animation: float  6.3s ease-in-out infinite; animation-delay:-3.0s; }
      .i6  { animation: float  5.8s ease-in-out infinite; animation-delay:-1.7s; }
      .i7  { animation: float  7.0s ease-in-out infinite; animation-delay:-0.9s; }
      .i8  { animation: float  6.5s ease-in-out infinite; animation-delay:-2.4s; }
      .i9  { animation: float  5.9s ease-in-out infinite; animation-delay:-1.1s; }
      .i10 { animation: float  6.7s ease-in-out infinite; animation-delay:-3.3s; }
      .i11 { animation: float  7.3s ease-in-out infinite; animation-delay:-0.3s; }
      .i12 { animation: float  6.1s ease-in-out infinite; animation-delay:-2.7s; }
      .i13 { animation: float  5.7s ease-in-out infinite; animation-delay:-1.5s; }
      .i14 { animation: float  6.9s ease-in-out infinite; animation-delay:-0.7s; }
      .i15 { animation: float  6.4s ease-in-out infinite; animation-delay:-2.0s; }
      .i16 { animation: float  7.1s ease-in-out infinite; animation-delay:-3.5s; }
      .i17 { animation: float  5.6s ease-in-out infinite; animation-delay:-1.9s; }
      .i18 { animation: float  6.6s ease-in-out infinite; animation-delay:-0.6s; }
      .i19 { animation: float  7.4s ease-in-out infinite; animation-delay:-2.8s; }
      .i20 { animation: float  6.2s ease-in-out infinite; animation-delay:-1.3s; }

      @keyframes float {
        0%   { transform: translateY(0px);   }
        50%  { transform: translateY(-10px); }
        100% { transform: translateY(0px);   }
      }
    </style>
  </defs>

  <!-- Icons scattered in a rough circle, varied sizes for depth feel -->
  <!-- Outer ring (larger, ~44-50px) -->
  <g class="i1"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg"                x="60"  y="170" width="52" height="52"/></g>
  <g class="i2"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"      x="100" y="60"  width="48" height="48"/></g>
  <g class="i3"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg"              x="240" y="30"  width="50" height="50"/></g>
  <g class="i4"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"                x="370" y="55"  width="48" height="48"/></g>
  <g class="i5"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"                  x="420" y="170" width="50" height="50"/></g>
  <g class="i6"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg"                x="390" y="310" width="48" height="48"/></g>
  <g class="i7"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg"                x="280" y="400" width="44" height="44"/></g>
  <g class="i8"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/photoshop/photoshop-original.svg"        x="130" y="390" width="46" height="46"/></g>
  <g class="i9"> <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/windows8/windows8-original.svg"          x="48"  y="300" width="46" height="46"/></g>
  <g class="i10"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg"              x="48"  y="82"  width="44" height="44"/></g>

  <!-- Mid ring (medium, ~36-42px) -->
  <g class="i11"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vscode/vscode-original.svg"              x="148" y="118" width="40" height="40"/></g>
  <g class="i12"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/illustrator/illustrator-plain.svg"       x="300" y="100" width="40" height="40"/></g>
  <g class="i13"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg"                    x="360" y="220" width="38" height="38"/></g>
  <g class="i14"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/jira/jira-original.svg"                  x="310" y="330" width="40" height="40"/></g>
  <g class="i15"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/canva/canva-original.svg"                x="160" y="330" width="38" height="38"/></g>
  <g class="i16"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/npm/npm-original-wordmark.svg"           x="102" y="228" width="40" height="40"/></g>
  <g class="i17"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg"      x="240" y="148" width="38" height="38"/></g>

  <!-- Inner cluster (smaller, ~28-34px) -->
  <g class="i18"><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/bash/bash-original.svg"                  x="200" y="230" width="34" height="34"/></g>

  <!-- Miro badge -->
  <g class="i19">
    <rect x="264" y="228" width="34" height="34" rx="7" fill="#FFD02F"/>
    <text x="281" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#050038">miro</text>
  </g>

  <!-- CLO3D badge -->
  <g class="i20">
    <rect x="222" y="294" width="34" height="34" rx="7" fill="#1A1A2E"/>
    <text x="239" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#E94560">CLO</text>
    <text x="239" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#E94560">3D</text>
  </g>

</svg>
